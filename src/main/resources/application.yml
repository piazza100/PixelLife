spring:
  profiles:
    default: local
  application:
    name: pixellife-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      cleanup-cron: "-"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/login/oauth2/code/google}
mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.pixellife.domain
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,application/javascript
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  cors.allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  rate-limit.requests-per-minute: ${API_RATE_LIMIT_PER_MINUTE:120}
  testing:
    allowed-emails: ${TEST_USER_EMAILS:}
billing:
  polar:
    access-token: ${POLAR_ACCESS_TOKEN:}
    plus-product-id: ${POLAR_PLUS_PRODUCT_ID:}
    webhook-secret: ${POLAR_WEBHOOK_SECRET:}
